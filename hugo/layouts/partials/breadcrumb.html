{{/*
  Breadcrumb partial.
  引数: slice of dict ({"label": "...", "url": "..."})
  最後の要素は url を無視してリンクなしで描画する。区切り `»` は CSS の ::after で付与。
*/}}
<nav class="breadcrumb">
  <ol>
    {{ range $i, $item := . }}
      {{ if $item.url }}
        <li><a href="{{ $item.url }}">{{ $item.label }}</a></li>
      {{ else }}
        <li>{{ $item.label }}</li>
      {{ end }}
    {{ end }}
  </ol>
</nav>
