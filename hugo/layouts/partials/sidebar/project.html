{{/* 引数: project page (`.` を渡す) */}}
<div class="sidebar-section">
  <h3>プロジェクト情報</h3>
  <dl class="meta-list">
    {{ with .Params.parent_identifier }}
    <dt>親プロジェクト</dt>
    <dd><a href="/projects/{{ . }}/">{{ $.Params.parent_name }}</a></dd>
    {{ end }}
    <dt>識別子</dt><dd>{{ .Params.identifier }}</dd>
    <dt>公開・非公開</dt><dd>{{ if .Params.project_is_public }}Public{{ else }}Private{{ end }}</dd>
    <dt>作成日</dt><dd>{{ .Params.created_on }}</dd>
  </dl>
</div>
