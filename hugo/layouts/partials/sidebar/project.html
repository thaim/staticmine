{{/*
  Project sidebar.
  引数: project page (`.` を渡す)。
  プロジェクトメタ情報（識別子・公開非公開・作成日）を表示する。
*/}}
<div class="sidebar-section">
  <h3>プロジェクト情報</h3>
  <dl class="meta-list">
    <dt>識別子</dt><dd>{{ .Params.identifier }}</dd>
    <dt>公開・非公開</dt><dd>{{ if .Params.project_is_public }}Public{{ else }}Private{{ end }}</dd>
    <dt>作成日</dt><dd>{{ .Params.created_on }}</dd>
  </dl>
</div>
